<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Envoyer ma photo · Pose Parquet</title><link rel="icon" type="image/svg+xml" href="../web/assets/favicon.svg"><link rel="stylesheet" href="phone-upload.css"><script type="module" src="../web/product/phone-upload.js"></script></head>
<body><header>Pose Parquet</header><main><div class="phone-symbol" aria-hidden="true">↥</div><h1>Votre pièce, sur grand écran</h1><p>Choisissez une photo sur ce téléphone. Elle s’ouvrira automatiquement dans le simulateur sur votre PC.</p><label class="phone-pick" for="phonePhoto">Choisir ma photo</label><input id="phonePhoto" type="file" accept="image/*" hidden><img id="phonePreview" alt="Votre photo avant envoi" hidden><button id="phoneSend" type="button" hidden>Envoyer sur mon PC</button><p id="phoneStatus" role="status" aria-live="polite"></p><p class="note">Aucun compte nécessaire. Gardez le simulateur ouvert sur votre PC. Votre photo n’est conservée que le temps du transfert.</p></main></body></html>
