[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-parquet-ai"
version = "0.1.0"
description = "Service d'analyse de photo de pièce pour le Visualiseur Parquet de pose-parquet.com"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }

# Fondation volontairement légère. Aucun framework de deep learning n'est
# installé « par anticipation » : les modèles sont choisis APRÈS benchmark
# (voir docs/roadmap.md). Toute dépendance lourde doit être documentée dans
# docs/architecture.md avant d'être ajoutée ici.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",  # requis par FastAPI pour multipart/form-data
  "numpy>=1.26",
  "opencv-python-headless>=4.10",  # headless : pas de dépendance GUI/X11
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",  # client de test de FastAPI
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "datasets"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "RET",      # returns
  "ARG",      # arguments inutilisés
  "PTH",      # pathlib
  "ANN",      # annotations de type
]
ignore = [
  "ANN401",  # Any explicite, toléré aux frontières de désérialisation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # les tests n'ont pas besoin d'annotations complètes

[tool.mypy]
python_version = "3.12"
files = ["app", "benchmarks", "scripts"]
strict = true
# OpenCV n'expose pas de stubs complets.
[[tool.mypy.overrides]]
module = ["cv2.*"]
ignore_missing_imports = true
